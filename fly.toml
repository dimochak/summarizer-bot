# fly.toml app configuration file generated for xxl-bot-summarizer on 2025-08-17T15:16:16+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xxl-bot-summarizer'
primary_region = 'waw'

[build]

[env]
  # Картинки для реакцій лежать на томі (див. [mounts]), а не в образі:
  # у репозиторій вони не потрапляють. Заливаються через `fly ssh sftp`.
  REACTIONS_DIR = "/app/data/reactions"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Add persistent volume for database
[mounts]
  source = "bot_data"
  destination = "/app/data"