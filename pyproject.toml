[project]
name = "xxl-bot-summarizer"
version = "1.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "apscheduler==3.*",
    "jinja2>=3.1.6",
    "langchain>=1.2.0",
    "langchain-google-genai>=4.1.3",
    "langchain-openai>=1.1.6",
    "loguru>=0.7.3",
    "openai>=1.102.0",
    "orjson==3.*",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11.7",
    "ddgs>=9.0.0",
    "python-dotenv==1.*",
    "python-telegram-bot==21.*",
    "pytz==2024.*",
    "telethon==1.*",
    "tiktoken>=0.11.0",
    "tornado>=6.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: потребує справжньої Postgres (див. XXL_TEST_DATABASE_URL)",
]
