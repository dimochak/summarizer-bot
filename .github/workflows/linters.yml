name: 📝 Linters
on:
  push:
    branches:
      - '*'
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - '*'
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Версію фіксуємо свідомо: ruff-action за замовчуванням тягне найсвіжіший
          # ruff, а він час від часу розширює набір правил за замовчуванням — і тоді
          # лінт червоніє без жодної зміни в коді, блокуючи деплой.
          version: "0.16.3"
          args: "check --select E4,E7,E9,F"
          src: "./src"
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
